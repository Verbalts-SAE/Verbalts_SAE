[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verbalts-sae"
version = "0.1.0"
description = "VerbalTS with Top-K Sparse Autoencoder latent steering for fine-grained morphological control of time series"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "VerbalTS-SAE Team"}
]
keywords = ["time-series", "generation", "sae", "steering", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "tensorboard>=2.14.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.0.270",
]
full = [
    "transformers>=4.30.0",
    "einops>=0.6.0",
    "linear-attention-transformer>=0.19.0",
    "opt_einsum>=3.3.0",
    "timm>=0.9.0",
    "datasets>=2.14.0",
    "sentence-transformers>=2.2.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "tslearn>=0.6.0",
    "pykeops>=2.1.0",
    "omegaconf>=2.3.0",
]

[project.scripts]
contsg = "contsg.cli:main"

[project.urls]
Homepage = "https://github.com/Verbalts-SAE/Verbalts_SAE"
Repository = "https://github.com/Verbalts-SAE/Verbalts_SAE"

[tool.setuptools.packages.find]
where = ["."]
include = ["contsg*", "sae*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
